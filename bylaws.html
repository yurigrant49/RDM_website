<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Example page with the Bylaws Assistant widget</title>
</head>
<body>
  <h1>Example Page</h1>
  <p>This page shows how to embed the chat widget. The chat bubble appears in the bottom-right corner.</p>

  <!--
    Replace data-api-url with your deployed backend's /ask endpoint.
    This is the ONLY line you need to add to any page on your site.
  -->
  <script
    src="./chat-widget.js"
    data-api-url="https://bylaws-assistant.onrender.com/ask"
    data-title="Bylaws Assistant"
  ></script>
</body>
</html>
